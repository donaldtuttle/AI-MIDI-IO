name: Import Windows MIDI Player source
on:
  push:
    branches: [main]
    paths:
      - "apps/windows-midi-player/.source-transfer/**"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract the supplied source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import tarfile

          root = Path("apps/windows-midi-player")
          chunks = root / ".source-transfer"
          expected = [f"part-{i:02d}.b64" for i in range(8)]
          assert sorted(p.name for p in chunks.glob("*.b64")) == expected
          encoded = b"".join((chunks / name).read_bytes() for name in expected)
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == "f76dfdda32520ec32f20c05707088d2cc67075581b0e967d206066ff074a9c7d"
          expected_files = {
              "InstrumentBank.cs", "MidiFile.cs", "MidiOutput.cs",
              "MidiSynth.cs", "Player.cs", "WaveOutput.cs",
              "player.ico", "player.manifest", "build.ps1", "README.md"
          }
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:xz") as archive:
              members = archive.getmembers()
              assert {m.name for m in members} == expected_files
              for member in members:
                  assert member.isfile()
                  assert "/" not in member.name and "\\" not in member.name
                  extracted = archive.extractfile(member)
                  assert extracted is not None
                  (root / member.name).write_bytes(extracted.read())
          print(f"Restored {len(expected_files)} original source files")
          PY
      - name: Commit source files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/windows-midi-player
          if git diff --cached --quiet; then
            echo "Files already synchronized"
            exit 0
          fi
          git commit -m "Restore Windows MIDI Player C# source and assets"
          git push origin HEAD:main
