name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s legacy -p test_backend.py -v
      - run: ai-midi-io demo --output-root demo-output
      - run: ai-midi-io validate demo-output/midi_generation/AI_MIDI_IO_Verification_4track_120BPM.mid --expected-musical-tracks 4 --expected-end-tick 30720
