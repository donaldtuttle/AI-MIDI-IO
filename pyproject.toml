[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-midi-io"
version = "0.1.0"
description = "Python tools for MIDI composition, event scheduling, and file workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Donald Tuttle" }]
dependencies = ["mido>=1.3.3,<2"]

[project.scripts]
ai-midi-io = "ai_midi_io.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
