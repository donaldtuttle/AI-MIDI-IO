[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-midi-io"
version = "0.1.0"
description = "MIDI tools for AI-assisted composition, generation, and validation workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DT, original AI MIDI IO creator" }]
dependencies = ["mido>=1.3.3,<2"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
ai-midi-io = "ai_midi_io.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
